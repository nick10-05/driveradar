[project]
name = "driveradar-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.163.2",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

# ---------------------------------------------------------------- ruff (lint + format)
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear: likely bugs
    "UP",       # pyupgrade: modern syntax
    "SIM",      # simplifications
    "S",        # bandit: security checks
    "ASYNC",    # async pitfalls (blocking calls in async code)
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works
# Generated migrations: the template imports op/sa for every file, even empty ones,
# and "Revises: " is blank for the first migration.
"alembic/versions/*" = ["F401", "W291"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]  # the local alembic/ folder is not our package

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["db: needs a real Postgres (set TEST_DATABASE_URL)"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/main.py"]  # import-time entry point only; create_app() is tested directly

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
